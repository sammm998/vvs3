name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Test suite (A-V)
        run: python -m pytest tests/python -q
      - name: Blind run on the generated drawings
        env:
          RUN_BLIND_TEST: "1"
          RUN_FORENSICS: "1"
        run: |
          python -m tests.fixtures.make_drawings artifacts/fixtures
          PYTHONPATH=src/python python -m vvs_pipe.cli analyse \
            artifacts/fixtures/drawing_a_clean.pdf --out artifacts/ci_a --forensics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-artifacts
          path: artifacts/ci_a

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
