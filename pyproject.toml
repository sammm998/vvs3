[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vvs-pipe"
version = "1.0.0"
description = "Automatic vector-PDF pipe analysis engine for VVS/VA drawings"
requires-python = ">=3.11"
dependencies = [
  "pymupdf==1.24.14",
  "numpy==2.1.3",
  "scipy==1.14.1",
  "shapely==2.0.6",
  "opencv-python-headless==4.10.0.84",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "openpyxl==3.1.5"]

[project.scripts]
vvs-pipe = "vvs_pipe.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src/python", "."]
addopts = "-q -p no:warnings"
